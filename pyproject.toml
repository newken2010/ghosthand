[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosthand"
version = "0.1.0"
description = "Human-like browser automation: irregular rhythm / long-press drag / anti-detection / AI gateway"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
server = ["websockets>=11"]
agent = ["browser-use>=0.12"]
all = ["websockets>=11", "browser-use>=0.12"]

[project.scripts]
ghosthand = "ghosthand.cli:main"

[tool.setuptools.packages.find]
include = ["ghosthand*"]